[project]
name = "nightwatch-backend"
version = "0.1.0"
description = "Nightwatch AI CCTV Event Intelligence API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "redis>=5.0.0",
    "google-cloud-storage>=2.18.0",
    "argon2-cffi>=23.1.0",
    "cryptography>=42.0.0",
    "passlib[bcrypt]>=1.7.4",
    "httpx>=0.27.0",
    "python-multipart>=0.0.12",
    "websockets>=13.0",
    "sendgrid>=6.11.0",
    "email-validator>=2.0.0",
    "google-genai>=1.0.0",
    "onnxruntime>=1.18.0",
    "opencv-python-headless>=4.9.0",
    "numpy>=1.26.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
]
