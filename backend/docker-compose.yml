services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nightwatch
      POSTGRES_PASSWORD: nightwatch
      POSTGRES_DB: nightwatch
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql+asyncpg://nightwatch:nightwatch@db:5432/nightwatch
      REDIS_URL: redis://redis:6379/0
      DEBUG: "true"
      SECRET_KEY: dev-secret-key-change-in-prod
      WORKER_API_KEY: dev-worker-key
      SUPER_ADMIN_EMAIL: admin@nightwatch.ai
      SUPER_ADMIN_PASSWORD: admin123
    depends_on:
      - db
      - redis

volumes:
  pgdata:
