# Nginx-RTMP server for Nightwatch push-mode cameras.
# Cameras configured with ingest_mode=rtmp_push stream to:
#   rtmp://<this-host>:1935/live/<stream_key>
# The worker reads the stream back as:
#   rtsp://127.0.0.1:8554/live/<stream_key>  (via the rtsp block below)
# or directly as RTMP if your worker pulls over RTMP instead.
#
# Usage:
#   docker run --rm -p 1935:1935 -p 8080:8080 \
#     -v $(pwd)/nginx.conf:/etc/nginx/nginx.conf \
#     tiangolo/nginx-rtmp
#
# Or build from Dockerfile.nginx in this directory.

worker_processes auto;

events {
    worker_connections 1024;
}

rtmp {
    server {
        listen 1935;
        chunk_size 4096;
        max_connections 64;

        application live {
            live on;

            # Drop the stream if no subscriber pulls it within 10s of publish
            idle_streams off;

            # Deny RTMP playback — worker pulls via FFmpeg subprocess, not RTMP
            deny play all;

            # Only allow push from localhost or trusted worker IPs.
            # In production, restrict to your worker VM's private IP.
            allow publish all;

            # Re-publish a local HLS fragment for diagnostics (optional, disable in prod).
            # hls on;
            # hls_path /tmp/hls;
            # hls_fragment 2s;
            # hls_playlist_length 10s;

            # Notify backend when a stream starts or ends (optional).
            # on_publish http://backend:8080/internal/rtmp/on_publish;
            # on_done    http://backend:8080/internal/rtmp/on_done;
        }
    }
}

http {
    server {
        listen 8080;

        # Health check — returns 200 if nginx is up.
        location /healthz {
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        # RTMP stat page — useful for debugging active streams.
        location /stat {
            rtmp_stat all;
            rtmp_stat_stylesheet stat.xsl;
        }

        location /stat.xsl {
            root /usr/local/nginx/html;
        }
    }
}
